<!DOCTYPE html>
<html>
<head>
  <title>Enhanced Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .calculator {
      width: 300px;
      margin: 50px auto;
      padding: 20px;
      background: #222;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    h2 {
      color: white;
      text-align: center;
    }

    #display {
      width: 100%;
      height: 60px;
      margin-bottom: 15px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 25px;
      text-align: right;
      border: none;
      border-radius: 10px;
      background: white;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      height: 55px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #444;
      color: white;
    }

    button:hover {
      background: #666;
    }

    .operator {
      background: #ff9500;
    }

    .clear {
      background: #e63946;
    }

    .equal {
      background: #28a745;
    }

    .delete {
      background: #555;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>

<body>

<div class="calculator">

  <h2>Calculator</h2>

  <input type="text" id="display" readonly>

  <div class="buttons">

    <button class="clear" onclick="resetCalculator()">C</button>
    <button onclick="addValue('.')">.</button>
    <button onclick="percentage()">%</button>
    <button class="operator" onclick="addValue('/')">÷</button>

    <button onclick="addValue('7')">7</button>
    <button onclick="addValue('8')">8</button>
    <button onclick="addValue('9')">9</button>
    <button class="operator" onclick="addValue('*')">×</button>

    <button onclick="addValue('4')">4</button>
    <button onclick="addValue('5')">5</button>
    <button onclick="addValue('6')">6</button>
    <button class="operator" onclick="addValue('-')">−</button>

    <button onclick="addValue('1')">1</button>
    <button onclick="addValue('2')">2</button>
    <button onclick="addValue('3')">3</button>
    <button class="operator" onclick="addvalue()">+</button>
    
    <button class="zero" onclick="addValue('0')">0</button>
    <button class="Delete" onclick="deletelast('⌫')">⌫</button>
    <button class="equal" onclick="calculate()">=</button>

  </div>

</div>


<script>

let display = document.getElementById("display");

let errorState = false;

function addValue(value) {

  if (errorState) {
    resetCalculator();
  }

  let current = display.value;
  let lastChar = current.slice(-1);

  if (
    ["+", "-", "*", "/"].includes(value) &&
    ["+", "-", "*", "/"].includes(lastChar)
  ) {
    return;
  }
  if (value === ".") {

    let parts = current.split(/[\+\-\*\/]/);
    let lastNumber = parts[parts.length - 1];

    if (lastNumber.includes(".")) {
      return;
    }
  }
  if (
    current === "" &&
    (value === "*" || value === "/")
  ) {
    return;
  }

  display.value += value;
}

function clearDisplay() {

  display.value = "";

}

function resetCalculator() {

  display.value = "";

  errorState = false;

}
function deleteLast() {

  if (errorState) {
    resetCalculator();
    return;
  }

  display.value =
    display.value.slice(0, -1);

}

function percentage() {

  if (errorState) {
    resetCalculator();
    return;
  }

  if (display.value === "") {
    return;
  }

  let value = Number(display.value);

  if (isNaN(value)) {

    showError("Error");
    return;

  }
  if (value === 0) {

    display.value = "0";
    return;

  }

  display.value = value / 100;

}

function showError(message) {

  display.value = message;
  errorState = true;

}


function calculate() {

  if (errorState) {
    return;
  }

  if (display.value === "") {
    return;
  }

  let expression = display.value;

  if (!/^[0-9+\-*/.]+$/.test(expression)) {

    showError("Error");
    return;

  }

  if (/[+\-*/]$/.test(expression)) {

    showError("Invalid");
    return;

  }

  if (/\/0+(?:\.0+)?(?:[^0-9.]|$)/.test(expression)) {

    showError("Cannot divide by 0");
    return;

  }

  try {

    let result = eval(expression);

    if (!isFinite(result)) {

      showError("Cannot divide by 0");
      return;

    }
    if (isNaN(result)) {

      showError("Error");
      return;

    }

    display.value = result;

  }

  catch {

    showError("Error");

  }

}


document.addEventListener("keydown", function(event) {

  let key = event.key;


  if (key >= "0" && key <= "9") {

    addValue(key);

  }


  else if (
    key === "+" ||
    key === "-" ||
    key === "*" ||
    key === "/"
  ) {

    addValue(key);

  }

  else if (key === ".") {

    addValue(".");

  }

  else if (key === "%") {

    percentage();

  }


  else if (
    key === "Enter" ||
    key === "="
  ) {

    event.preventDefault();
    calculate();

  }


  else if (key === "Backspace") {

    deleteLast();

  }

  else if (key === "Escape" || key === "c" || key === "C") {

    resetCalculator();

  }

});

</script>

</body>
</html>
